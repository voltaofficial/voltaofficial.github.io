<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volta Home</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>

    <!-- Top bar -->
    <header class="top-bar">

        <img
            src="voltalogo.png"
            alt="Volta"
            class="volta-logo">

        <div class="top-actions">

            <button class="top-icon" aria-label="Search">
                <img src="/images/search_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                     alt="Search">
            </button>

            <button class="top-icon" aria-label="Wallet">
                <img src="/images/account_balance_wallet_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                     alt="Wallet">
            </button>

            <button class="top-icon" aria-label="Notifications">
                <img src="/images/notifications_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                     alt="Notifications">
            </button>

            <button class="top-icon" aria-label="Chat">
                <img src="/images/sms_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                     alt="Chat">
            </button>

        </div>

    </header>


    <!-- Main content -->
    <main class="home-content">

        <section class="discover">

            <h1>Discover games</h1>

            <p class="section-description">
                Popular games
            </p>

            <div class="game-grid">

                <button class="game-card">
                    <div class="game-image">🎮</div>
                    <h2>Popular Game</h2>
                    <p>Play now</p>
                </button>

                <button class="game-card">
                    <div class="game-image">🚀</div>
                    <h2>Space Adventure</h2>
                    <p>Play now</p>
                </button>

                <button class="game-card">
                    <div class="game-image">🏎️</div>
                    <h2>Drive Rush</h2>
                    <p>Play now</p>
                </button>

                <button class="game-card">
                    <div class="game-image">🧩</div>
                    <h2>Puzzle World</h2>
                    <p>Play now</p>
                </button>

            </div>

        </section>

    </main>


    <!-- Bottom navigation -->
    <nav class="bottom-nav">

        <button class="nav-button active" aria-label="Home">
            <img
                src="/images/home_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                alt="Home">
            <small>Home</small>
        </button>

        <button class="nav-button" aria-label="Marketplace">
            <img
                src="/images/storefront_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                alt="Marketplace">
            <small>Marketplace</small>
        </button>

        <button class="create-nav-button" aria-label="Create">
            +
        </button>

        <button class="nav-button" aria-label="Profile">
            <img
                src="/images/account_circle_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                alt="Profile">
            <small>Profile</small>
        </button>

    </nav>

</body>
    </html>
