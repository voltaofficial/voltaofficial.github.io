<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volta Home</title>
    <link rel="stylesheet" href="./home.css">
</head>

<body>

    <!-- Top bar -->
    <header class="top-bar">

        <img
            src="/images/voltalogo.png"
            alt="Volta"
            class="volta-logo">

        <div class="top-actions">

            <button class="top-icon" aria-label="Search">
                <img src="/images/search_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                     alt="Search">
            </button>

            <button class="top-icon" aria-label="Wallet">
                <img src="/images/account_balance_wallet_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                     alt="Wallet">
            </button>

            <button class="top-icon" aria-label="Notifications">
                <img src="/images/notifications_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                     alt="Notifications">
            </button>

            <button class="top-icon" aria-label="Chat">
                <img src="/images/sms_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                     alt="Chat">
            </button>

        </div>

    </header>


    <!-- Main content -->
    <main class="home-content">

        <section class="discover">

            <h1>Discover games</h1>

            <p class="section-description">
                Popular games
            </p>

            <div class="empty-games">
                
                <p>No popular games.</p>

            </div>
            
            </section>


    <!-- Bottom navigation -->
    <nav class="bottom-nav">

        <button class="nav-button active" aria-label="Home">
            <img
                src="/images/home_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                alt="Home">
            <small>Home</small>
        </button>

        <button class="create-nav-button" aria-label="Create">
            +
        </button>

        <button class="nav-button" aria-label="Posts">
            <img
                src="/images/planet_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                alt="Posts">
            <small>Posts</small>
        </button>

        <button class="nav-button" aria-label="Profile">
            <img
                src="/images/account_circle_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png"
                alt="Profile">
            <small>Profile</small>
        </button>

    </nav>

        <!-- Create Menu Overlay -->
<div id="createOverlay" class="create-overlay">
    <section class="create-panel" role="dialog" aria-modal="true"
             aria-labelledby="createTitle">

        <button class="create-close" onclick="closeCreateMenu()"
                aria-label="Close">&times;</button>

        <h2 id="createTitle">Create</h2>

        <!-- Create Menu Tabs -->
        <div class="create-tabs">
            <button class="create-tab active"
                    onclick="showCreateSection('games', this)">
                Games
            </button>

            <button class="create-tab"
                    onclick="showCreateSection('post', this)">
                Post
            </button>
        </div>

        <!-- GAMES -->
        <form id="gamesSection" class="create-section"
              onsubmit="publishGame(event)">

            <h3>Create a game</h3>

            <label for="gameName">Game name</label>
            <input id="gameName" type="text"
                   placeholder="Write game name"
                   maxlength="60" required>

            <button type="submit" class="create-submit">

                <script>
function createGame() {
    const gameName = document.getElementById("gameName").value.trim();

    if (!gameName) {
        alert("Please write a game name.");
        return;
    }

    localStorage.setItem("voltaGameName", gameName);
    window.location.href = "game_editor.html";
}
                </script>
                
                Create game
            </button>
        </form>

    localStorage.setItem("voltaGameName", gameName);
    window.location.href = "game_editor.html";
}
</script>

        <!-- POST -->
        <form id="postSection" class="create-section hidden"
              onsubmit="publishPost(event)">

            <h3>Create a post</h3>

            <label for="postImage">Select an image</label>
            <input id="postImage" type="file"
                   accept="image/*" required>

            <label for="postTitle">Post title</label>
            <input id="postTitle" type="text"
                   placeholder="Write post title"
                   maxlength="100" required>

            <label for="postDescription">Description</label>
            <textarea id="postDescription"
                      placeholder="Write a description"
                      rows="4" maxlength="2000"
                      required></textarea>

            <button type="submit" class="create-submit">
                Publish post
            </button>
        </form>

        <p id="createMessage" class="create-message"
           role="status"></p>

    </section>
</div>

<script>
    const createOverlay = document.getElementById("createOverlay");

    // Open the Create menu
    document.querySelector(".create-nav-button").addEventListener("click", () => {
        createOverlay.classList.add("visible");
        document.body.classList.add("dialog-open");
    });

    // Close the Create menu
    function closeCreateMenu() {
        createOverlay.classList.remove("visible");
        document.body.classList.remove("dialog-open");
    }

    // Switch between Games, Assets, and Post
    function showCreateSection(section, button) {
        document.querySelectorAll(".create-section").forEach(form => {
            form.classList.add("hidden");
        });

        document.getElementById(section + "Section").classList.remove("hidden");

        document.querySelectorAll(".create-tab").forEach(tab => {
            tab.classList.remove("active");
        });

        button.classList.add("active");

        document.getElementById("createMessage").textContent = "";
    }

    // Demo: validate a game submission
    function publishGame(event) {
        event.preventDefault();

        const name = document.getElementById("gameName").value.trim();
        const template = document.getElementById("gameTemplate").value;

        if (!name || !template) return;

        showMessage(
            'Game "' + name + '" is ready to publish using the ' +
            template + ' template. A publishing backend is required to publish it.'
        );
    }

    // Demo: validate an asset submission
    function publishAsset(event) {
        event.preventDefault();

        const name = document.getElementById("assetName").value.trim();
        const type = document.getElementById("assetType").value;
        const image = document.getElementById("assetImage").files[0];

        if (!name || !type || !image) return;

        showMessage(
            type + ' asset "' + name +
            '" is selected. Connect a backend to save or publish it.'
        );
    }

    // Demo: validate a post submission
    function publishPost(event) {
        event.preventDefault();

        const title = document.getElementById("postTitle").value.trim();
        const description = document.getElementById("postDescription").value.trim();
        const image = document.getElementById("postImage").files[0];

        if (!title || !description || !image) return;

        showMessage(
            'Post "' + title +
            '" is ready. Connect a backend to publish it.'
        );
    }

    function showMessage(message) {
        document.getElementById("createMessage").textContent = message;
    }

    // Close when tapping outside the panel
    createOverlay.addEventListener("click", event => {
        if (event.target === createOverlay) {
            closeCreateMenu();
        }
    });

    // Close with Escape
    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            closeCreateMenu();
        }
    });
            </script>
        
</body>
    </html>
