<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">
        <img src="voltalogo.png" alt="Volta" class="volta-logo">

        <h1>Welcome to Volta</h1>

        <p class="description">
            Play or create games from draw it!
        </p>

        <div class="buttons">
            <button
                type="button"
                class="create-button"
                onclick="openCreateUser()">
                Create user
            </button>

            <button
                type="button"
                class="login-button">
                Log in
            </button>
        </div>

        <p class="terms">
            If you accept
            <a href="#">Terms of Service</a>
            or
            <a href="#">Privacy Policy</a>,
            please login it.
        </p>
    </main>


    <!-- Create User Modal -->
    <div
        id="createUserDialog"
        class="dialog-overlay"
        aria-hidden="true">

        <section
            class="create-user-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="createUserTitle">

            <button
                type="button"
                class="dialog-close"
                aria-label="Close"
                onclick="closeCreateUser()">
                ×
            </button>

            <h2 id="createUserTitle">
                Create with user
            </h2>

            <input
                id="usernameInput"
                type="text"
                class="username-input"
                placeholder="Write username"
                maxlength="30"
                autocomplete="username">

            <button
                type="button"
                class="dialog-done"
                onclick="createUser()">
                Done
            </button>

        </section>
    </div>


    <script>
        const dialog = document.getElementById("createUserDialog");
        const usernameInput = document.getElementById("usernameInput");

        function openCreateUser() {
            dialog.classList.add("show");
            dialog.setAttribute("aria-hidden", "false");

            setTimeout(() => {
                usernameInput.focus();
            }, 100);
        }

        function closeCreateUser() {
            dialog.classList.remove("show");
            dialog.setAttribute("aria-hidden", "true");
        }

        function createUser() {
            const username = usernameInput.value.trim();

            if (!username) {
                usernameInput.focus();
                return;
            }

            alert("User created: " + username);
        }

        // Close when clicking outside the dialog
        dialog.addEventListener("click", function(event) {
            if (event.target === dialog) {
                closeCreateUser();
            }
        });

        // Close with Escape
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape" && dialog.classList.contains("show")) {
                closeCreateUser();
            }
        });
    </script>

</body>
</html>
