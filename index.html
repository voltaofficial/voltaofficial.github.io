<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <img src="voltalogo.png" alt="Volta" class="volta-logo">

        <h1>Welcome to Volta</h1>

        <p class="description">
            Play or create games from draw it!
        </p>

        <div class="buttons">
            <button class="create-button">Create user</button>
            <button class="login-button">Log in</button>
        </div>

        <p class="terms">
            If you accept
            <a href="#">Terms of Service</a>
            or
            <a href="#">Privacy Policy</a>,
            please login it.
        </p>
    </main>
</body>
</html>
